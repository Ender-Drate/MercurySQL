# Build the package and upload it to PyPI when a release is published.
#
# Publishing is gated on the test job, and it authenticates through PyPI
# Trusted Publishing (OIDC) instead of a long-lived API token:
#   PyPI -> Your project -> Publishing -> Add a new publisher
#   Owner / Repository: the repository this workflow runs in
#   Workflow: publish-pypi.yml | Environment: pypi
# Configure the publisher on PyPI before the first release, otherwise the upload
# job has no credentials.

name: Upload Python Package

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    name: Test before publishing
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.3.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.x"
      - run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
          python -m pytest tests -q

  build:
    name: Build sdist and wheel
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.3.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.x"
      - name: Build
        run: |
          python -m pip install --upgrade pip build twine
          python -m build
      - name: Verify the metadata and the archive contents
        run: |
          python -m twine check dist/*
          python - <<'PY'
          import glob, tarfile, zipfile
          for path in glob.glob("dist/*"):
              if path.endswith(".whl"):
                  names = zipfile.ZipFile(path).namelist()
              else:
                  names = tarfile.open(path).getnames()
              assert any(n.endswith("MercurySQL/VERSION") for n in names), path
              print(path, "ok")
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  publish:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/MercurySQL
    permissions:
      id-token: write   # Trusted Publishing (OIDC)
    steps:
      - name: Download the built distribution
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4.3.0
        with:
          name: dist
          path: dist/
      - name: Publish
        uses: pypa/gh-action-pypi-publish@27b31702a0e7fc50959f5ad993c78deac1bdfc29
