name: "[CI] Multi-thread Test"

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    types: [opened, reopened, synchronize]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test_extreme_multithread:
    name: "EXTREME: Multi-thread Test"
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.3.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.x"

      - name: Install package
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Concurrent access from several threads
        # Run it three times: a race that only fails sometimes must not pass CI.
        run: |
          for i in 1 2 3; do
            (cd tests/extreme && python multithread.py)
          done

      - name: Threads must not leak
        run: python -m pytest tests -q -k "f07 or f03"
