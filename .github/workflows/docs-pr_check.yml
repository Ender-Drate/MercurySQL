name: Docs - Pull Request Docs Check

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "MercurySQL/**"
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - "docs/**"
      - "MercurySQL/**"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build the Sphinx documentation
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.3.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.x"

      - name: Install the package and the docs requirements
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
          python -m pip install -r docs/requirements.txt

      # Warnings are errors: a broken reference fails the build instead of
      # silently shipping a broken page.
      - name: Build the docs
        run: python -m sphinx -b html -W --keep-going docs/source docs/build/html

      - name: Upload the built documentation
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: Documentation HTML
          path: docs/build/html/
          if-no-files-found: error
