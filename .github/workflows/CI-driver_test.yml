name: "[CI] Driver Test"

# Tests run on `pull_request`, NOT on `pull_request_target`: the latter checks
# out the *base* branch, so a PR could never be gated on its own code while the
# badge still turned green.
on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    types: [opened, reopened, synchronize]

# Read-only token: a test run never needs to write to the repository.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test_driver_sqlite:
    name: Driver Test - SQLite (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # `requires-python = ">=3.8"`, so 3.8 is the floor and the newest
        # stable is the ceiling.
        python-version: ["3.8", "3.11", "3.13"]

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.3.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Run the test-suite
        run: python -m pytest tests -q

      - name: Run the legacy golden-output tests
        run: |
          cd tests/drivers && python sqlite.py
          cd ../extreme && python multithread.py
