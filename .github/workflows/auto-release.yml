name: Auto Release

# Creates a *draft* GitHub release when MercurySQL/VERSION changes on main.
# Publishing it (which triggers publish-pypi.yml) stays a human decision.

on:
  push:
    branches:
      - main
    paths:
      - MercurySQL/VERSION
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release:
    name: Auto Release
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.3.1
        with:
          fetch-depth: 0

      - name: Read the current and the previous version
        run: |
          curr="$(cat MercurySQL/VERSION)"
          echo "CURR_VERSION=$curr" >> "$GITHUB_ENV"
          # The parent commit may not contain the file at all (it was added in
          # this commit): fall back to the previous tag instead of failing.
          if git show HEAD^:MercurySQL/VERSION >/dev/null 2>&1; then
            prev="$(git show HEAD^:MercurySQL/VERSION)"
          else
            prev="$(git describe --tags --abbrev=0 2>/dev/null | sed 's/^v//' || true)"
          fi
          echo "PREV_VERSION=${prev:-0.0.0}" >> "$GITHUB_ENV"

      - name: Create the draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view "v$CURR_VERSION" >/dev/null 2>&1; then
            echo "Release v$CURR_VERSION already exists, nothing to do."
            exit 0
          fi
          {
            echo "From $PREV_VERSION -> $CURR_VERSION"
            echo
            echo "**Full Changelog**: https://github.com/${{ github.repository }}/compare/v$PREV_VERSION...v$CURR_VERSION"
          } > release-notes.md
          gh release create "v$CURR_VERSION" \
            --title "v$CURR_VERSION" \
            --notes-file release-notes.md \
            --draft \
            --target "$GITHUB_SHA"
